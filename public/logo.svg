<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 48" width="156" height="48" role="img" aria-label="Eatsly">
  <title>Eatsly horizontal lockup</title>
  <g transform="translate(2 4) scale(1.667)">
    <!-- map pin in brand green -->
    <path
      d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"
      fill="#0B7A55"
      stroke="#0B7A55"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <!-- white plate: rim + thinner inner ring -->
    <circle cx="12" cy="10" r="3.4" fill="none" stroke="#FFFFFF" stroke-width="1.7" />
    <circle cx="12" cy="10" r="1.8" fill="none" stroke="#FFFFFF" stroke-width="1.05" />
    <!-- orange leaf at the top-right of the plate -->
    <path d="M15.4 6.3 Q15.4 4.5 17.2 4.5 Q17.2 6.3 15.4 6.3 Z" fill="#FF7A1A" />
  </g>
  <!-- Wordmark: Sora 700 with system fallbacks when Sora is unavailable.
       The React <Logo/> renders exactly with the bundled Sora webfont. -->
  <text
    x="50"
    y="33"
    font-family="Sora, 'Avenir Next', 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.6"
  >
    <tspan fill="#12213F">Eats</tspan><tspan fill="#FF7A1A">ly</tspan>
  </text>
</svg>
